name: Extension checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression tests
        run: npm test
